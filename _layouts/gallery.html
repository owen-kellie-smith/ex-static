<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | EX Music Summer School</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
</head>
<body>
  {% include header.html %}

  <div class="container-gallery">
   <main>
    {{ content }}
   </main>
  </div>

  {% include footer.html %}
</body>
<script><!-- make all external links and pdfs open in a new window -->
document.querySelectorAll('a[href^="http"], a[href$=".pdf"]').forEach(a => {
  a.setAttribute('target', '_blank');
  a.setAttribute('rel', 'noopener noreferrer');
});
</script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>GLightbox({ touchNavigation: true, loop: true, autoplayVideos: false });</script>
</html>
