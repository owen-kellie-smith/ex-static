<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; }
  .hero-slider {
    position: relative;
    width: 100%;
    height: 500px;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .slide.active {
    opacity: 1;
    z-index: 1;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay-text {
    position: absolute;
    bottom: 20%;
    left: 5%;
    color: white;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.7);
  }

</style>

<section class="hero-slider">
  <div class="slide ">
    <img src="assets/images/slide_baton.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_clarinet.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_sax.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_flute.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_trombone.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_horn.jpg" >
  </div>
  <div class="slide">
    <img src="assets/images/slide_music_light.jpg" >
  </div>

</section>

<script>
const slides = document.querySelectorAll('.slide');
// Get saved slide index (default to 0)
let current = parseInt(localStorage.getItem('heroSlide')) || 0;


function showSlide(index) {
  slides.forEach((s, i) => {
    s.classList.toggle('active', i === index);
  });
  current = index;

  // Save to localStorage
  localStorage.setItem('heroSlide', current);

}

function nextSlide() {
  let next = (current + 1) % slides.length;
  showSlide(next);
}
// initialize with next slide to mark page refresh
nextSlide();

setInterval(nextSlide, 5000);
</script>
